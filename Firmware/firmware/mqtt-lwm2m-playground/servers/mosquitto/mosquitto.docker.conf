# Mosquitto configuration for the playground (local, non-Docker).
# Used by docker-compose.yml (mounted at /mosquitto/config).

# lab only - see docs/server.md "Creating users"
allow_anonymous true
# publish $SYS statistics every 2 s (dashboard reads them)
sys_interval 2
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %H:%M:%S

# Plain MQTT over TCP
listener 1883

# MQTT over TLS (lab CA in ./certs, regenerate with ./gen-certs.sh)
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
